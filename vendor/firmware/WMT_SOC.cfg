#ANT mode
#0 : not support ePa/eLna
#1 : support ePa/eLna
coex_wmt_ant_mode=1

wmt_gps_lna_pin=0
wmt_gps_lna_enable=0

#clock type
#0 : TCXO(can't	calibration)
#1 : co-tms
co_clock_flag=1

#bit0 : 1/0 Enable/Disable feature BT LV8 from Wi-Fi
#bit1 : 1/0 Enable/Disable feature channel compensation 1db
#bit2 : 1/0 Enable/Disable feature BT BDR/EDR compensation 1db, at LV8 during Channel 39~43
bt_tssi_from_wifi=0

#3776=12dBm,3808=13dBm,step: 32/dB
bt_tssi_target=3776

#ANT swap mode
#0 : off
#1 : on
#2 : on/off is decided by HWID(*1)
wifi_ant_swap_mode=1

#main ANT polarity
#0 :
# when ANT_SEL gpio read low, MAIN ANT is working
# when ANT_SEL gpio read high, AUX ANT is working
#1 :
# when ANT_SEL gpio read low, AUX ANT is working
# when ANT_SEL gpio read high, MAIN ANT is working
wifi_main_ant_polarity=1

#ANT_SEL_[Number] is used for ANT SWAP (*2)
wifi_ant_swap_ant_sel_gpio=1
