[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled
policy= power_allocator

[LTF]
thermal_zone= charge
mode= enabled
policy= step_wise

[LTF]
thermal_zone= usb_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= mux_sd
mode= enabled
policy= step_wise

[LTF]
thermal_zone= ap_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= pmic_t
mode= enabled
policy= step_wise

[LTF]
thermal_zone= consys
mode= enabled
policy= step_wise

[LTF]
thermal_zone= mtk-master-charger
mode= enabled
policy= step_wise

[charger-cooler]
mode= disabled
sensor= ap_ntc
threshold= [43000, 46000, 49000]
hysteresis= [2000, 2000, 2000]
current= [1800, 1000, 0]

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 0
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [1075000, 875000, 500000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 1
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [1002000, 835000, 774000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= soc_max
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [535000, 434000, 299000]